services:
  - type: web
    name: belgrano-ticketera
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python -c "import app_deploy; print('✅ app_deploy module ready')"
    startCommand: |
      gunicorn app_deploy:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: BELGRANO_AHORRO_URL
        sync: false
      - key: BELGRANO_AHORRO_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
