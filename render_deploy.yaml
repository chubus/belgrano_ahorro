services:
  - type: web
    name: belgrano-ticketera
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python belgrano_tickets/actualizar_db.py
      python scripts/init_users_flota.py
    startCommand: |
      cd belgrano_tickets && python app.py
    envVars:
      - key: BELGRANO_AHORRO_URL
        sync: false
      - key: BELGRANO_AHORRO_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
