services:
  - type: web
    name: belgrano-tickets
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app_deploy:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: FLASK_ENV
        value: production
      - key: RENDER_ENVIRONMENT
        value: production
      - key: BELGRANO_AHORRO_URL
        value: https://belgranoahorro.onrender.com
      - key: BELGRANO_AHORRO_API_KEY
        value: belgrano_ahorro_api_key_2025
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true
