# docker-compose.yml optimizado para deploy
# =================================================================
# BELGRANO AHORRO - TICKETERA
# =================================================================

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Deshabilitar BuildKit para evitar problemas de conexión
      args:
        - DOCKER_BUILDKIT=0
    ports:
      - "10000:10000"
    environment:
      # Variables de entorno críticas
      - FLASK_ENV=production
      - DOCKER_BUILDKIT=0
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Variables de la aplicación
      - BELGRANO_AHORRO_URL=${BELGRANO_AHORRO_URL}
      - BELGRANO_AHORRO_API_KEY=${BELGRANO_AHORRO_API_KEY}
      - RENDER_ENVIRONMENT=${RENDER_ENVIRONMENT:-production}
    volumes:
      # Persistir datos importantes
      - ./data:/app/data
      - ./logs:/app/logs
      # Montar productos.json para persistencia
      - ./productos.json:/app/productos.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/devops/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Servicio de backup automático
  backup:
    image: alpine:latest
    volumes:
      - ./data:/backup/data
      - ./productos.json:/backup/productos.json
    command: |
      sh -c "
        while true; do
          sleep 3600
          cp /backup/productos.json /backup/data/productos_backup_$$(date +%Y%m%d_%H%M%S).json
          echo 'Backup automático creado'
        done
      "
    restart: unless-stopped

volumes:
  data:
  logs:

networks:
  default:
    driver: bridge

