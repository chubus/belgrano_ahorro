services:
  - type: web
    name: belgrano-ahorro
    env: python
    buildCommand: |
      pip install -r requirements.txt
      echo "Build completado"
    startCommand: |
      echo "Iniciando aplicación..."
      gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: BELGRANO_AHORRO_URL
        value: https://belgranoahorro-hp30.onrender.com
      - key: BELGRANO_AHORRO_API_KEY
        value: belgrano_ahorro_api_key_2025
      - key: TICKETERA_URL
        value: https://ticketerabelgrano.onrender.com
      - key: TICKETERA_API_KEY
        value: ticketera_api_key_2025
      - key: SECRET_KEY
        value: belgrano_ahorro_secret_key_2025