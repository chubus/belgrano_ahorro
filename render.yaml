services:
  - type: web
    name: devops-service
    env: python
    buildCommand: |
      pip install -r devops/requirements.txt
      echo "✅ Build completado - Dependencias instaladas"
      echo "📁 Verificando estructura..."
      ls -la devops/ || dir devops
      echo "✅ Estructura verificada"
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --keep-alive 5 wsgi:application
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          property: port
