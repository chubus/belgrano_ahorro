services:
  - type: web
    name: belgrano-ahorro
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      gunicorn --bind 0.0.0.0:$PORT --workers 2 --worker-class sync --timeout 120 --keep-alive 5 wsgi:application
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: FLASK_APP
        value: wsgi:application
      - key: FLASK_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          property: port
      # Configuración de la base de datos PostgreSQL (RECOMENDADO - persistente)
      - key: DATABASE_URL
        fromDatabase:
          name: belgrano-ahorro-db
          property: connectionString
      # Configuración de la API de Belgrano Ahorro
      - key: BELGRANO_AHORRO_URL
        value: https://belgranoahorro-aliq.onrender.com
      - key: BELGRANO_AHORRO_API_KEY
        sync: false  # Configurar manualmente en Render Dashboard
      # Configuración de Cloudinary para almacenamiento de imágenes
      - key: CLOUDINARY_CLOUD_NAME
        value: dc2n1p5wx
      - key: CLOUDINARY_API_KEY
        value: "882162797341932"
      - key: CLOUDINARY_API_SECRET
        sync: false  # Configurar manualmente en Render Dashboard por seguridad

databases:
  - name: belgrano-ahorro-db
    databaseName: belgrano_ahorro
    user: belgrano_ahorro_user
    plan: free  # Plan gratuito de Render
